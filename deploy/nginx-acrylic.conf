server {
    listen 80;
    server_name _;

    # Admin 前端静态文件
    location /acrylic/admin {
        alias /opt/acrylic-outbound-system/admin/dist;
        try_files $uri $uri/ /acrylic/admin/index.html;
        index index.html;
    }

    # API 反向代理到 Server
    location /acrylic/ {
        proxy_pass http://127.0.0.1:7001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
